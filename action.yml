name: 'WP Release Deploy SVN'
description: 'Deploy a WordPress plugin to the WordPress.org plugin SVN repository.'
author: 'WP Elevator'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  release-ref:
    description: 'Release tag ref to deploy to the configured SVN targets, such as refs/tags/plugins/my-plugin/1.2.0. Takes source files, writes and targets from the release config instead of the single-plugin inputs.'
    default: ''
  package:
    description: 'With release-ref, deploy only these package identifiers or paths, one per line.'
    default: ''
  list:
    description: 'With release-ref, list the configured deploys without running them. Sets the packages output for a CI matrix.'
    default: 'false'
  config:
    description: 'Path to a JavaScript release config file. Defaults to wp-release.config.js, .mjs or .cjs in the repository root.'
    default: ''
  tag-format:
    description: 'Release tag format that replaces tagFormat from the release config for this run.'
    default: ''
  source-dir:
    description: 'Directory with the plugin files to deploy. Defaults to the repository root.'
    default: ''
  slug:
    description: 'WordPress.org slug for single-plugin deploys; ignored with release-ref.'
    default: ${{ github.event.repository.name }}
  version:
    description: 'Version to check against the headers. Defaults to svn-tag, then to the Version header of the deployed files.'
    default: ''
  trunk:
    description: 'Sync the full source directory to trunk/.'
    default: 'false'
  readme-only:
    description: 'Sync only the readme to trunk/. Not allowed with svn-tag.'
    default: 'false'
  assets:
    description: 'Set to false to skip syncing assets-dir for this run. Assets are synced whenever assets-dir is set.'
    default: ''
  svn-tag:
    description: 'Version to create as tags/<version>. With trunk, the tag is a copy of the synced trunk/; without it, the tag is built from the source files and trunk/ is left alone. A leading "v" is stripped. Empty disables tagging.'
    default: ''
  assets-dir:
    description: 'Directory with the banners, icons and screenshots to sync to the SVN assets/ directory. Assets are not deployed unless this is set.'
    default: ''
  readme:
    description: 'Readme file name. The default is ignored with release-ref; a custom name conflicts with configured deployment.'
    default: 'readme.txt'
  from-zip:
    description: 'Deploy the contents of this ZIP file, with a {slug}/ root folder, instead of source-dir.'
    default: ''
  distignore:
    description: 'Path to the ignore file, or "false" to not read one. Defaults to .distignore in source-dir when present.'
    default: ''
  exclude:
    description: 'Extra gitignore-style patterns to leave out, separated by commas or new lines, like "build/,assets/*,images/**/*".'
    default: ''
  exclude-gitattributes:
    description: 'Also exclude paths marked export-ignore in Git attributes. Requires source-dir to be inside a Git repository; ignored with from-zip.'
    default: 'false'
  svn-url:
    description: 'SVN repository URL with a {slug} placeholder. Defaults to https://plugins.svn.wordpress.org/{slug}/.'
    default: ''
  svn-username:
    description: 'WordPress.org SVN username, only needed for the commit. Defaults to the SVN_USERNAME environment variable.'
    default: ''
  svn-password:
    description: 'WordPress.org SVN password, only needed for the commit. Defaults to the SVN_PASSWORD environment variable.'
    default: ''
  message:
    description: 'SVN commit message.'
    default: ''
  force:
    description: 'Replace an existing SVN tag of the same version.'
    default: 'false'
  dry-run:
    description: 'Run every step except the SVN commit. SVN credentials are not required.'
    default: 'false'

outputs:
  slug:
    description: 'Resolved WordPress.org slug for a single-plugin deploy; empty with release-ref.'
  version:
    description: 'Deployed version for a single-plugin deploy; empty when unknown or with release-ref.'
  committed:
    description: 'Whether a commit was made for a single-plugin deploy; empty with release-ref.'
  revision:
    description: 'SVN revision for a single-plugin deploy; empty without a commit or with release-ref.'

  result:
    description: 'Full command result as JSON: a single deploy, configured package plan or configured deployment outcomes.'
  packages:
    description: 'JSON array of configured package plans with list; otherwise an empty array.'
  deploys:
    description: 'JSON array of configured deployment outcomes, including errors; otherwise an empty array.'

runs:
  using: 'node24'
  main: 'dist/index.js'
